spring.application.name=payments

spring.profiles.default=H2,liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

payments.notes.default-length=500
payments.currency.default-currency=JOD,USD
payments.template.default-name=payment-default
payments.uploud-bulk.save=false

jwt.secret=${JWT_SECRET:quickpay-dev-secret-change-me-0123456789}
jwt.expiry-minutes=5
jwt.refresh-expiry-minutes=60
