services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paymentsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - quickpay-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d paymentsdb" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: payments/application
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres,liquibase
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: paymentsdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      PAYMENTS_NOTES_MAX_LENGTH: "20"
      PAYMENTS_ALLOWED_CURRENCIES: "JOD,USD"
      PAYMENTS_PERSIST_DB_ON_ERROR: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  quickpay-db-data: